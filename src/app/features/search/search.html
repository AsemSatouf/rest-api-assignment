<section class="page-header">
  <h2>Search Games</h2>
  <p>Find your favorite games instantly</p>
</section>

<div class="search-box">

  <input
    type="text"
    placeholder="Search for a game..."
    [(ngModel)]="searchText"
  >

  <button (click)="searchGames()">
    Search
  </button>

</div>

<div class="grid">

  <app-game-card
    *ngFor="let game of games"
    [game]="game">
  </app-game-card>

</div>
